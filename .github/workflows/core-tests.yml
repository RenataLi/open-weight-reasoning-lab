name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "PyYAML==6.0.3"

      - name: Compile package
        run: python -m compileall -q src

      - name: Run CPU-only core suite
        run: >-
          python -m pytest
          tests/test_config.py
          tests/test_parsing.py
          tests/test_metrics.py
          tests/test_arithmetic_generator.py
          tests/test_stage3_selection.py
          tests/test_stage4_selection.py
