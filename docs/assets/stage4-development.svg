<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Stage 4 DPO development scorecard</title>
  <desc id="desc">Selected DPO compared with its frozen parent and selected extra-SFT control, plus a candidate safety frontier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#18112B"/></linearGradient>
    <linearGradient id="dpo" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#818CF8"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">STAGE 4 · DPO DEVELOPMENT SCORECARD</text>
  <text x="56" y="88" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Frozen validation roles · selected by worst-task retention</text>

  <g transform="translate(48 122)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="700" height="410" rx="18" fill="#111827" stroke="#334155"/>
    <text x="28" y="42" fill="#E2E8F0" font-size="18" font-weight="700">Capability retention</text>
    <text x="28" y="65" fill="#64748B" font-size="12">exact match · percent</text>

    <g transform="translate(28 96)">
      <text x="0" y="17" fill="#CBD5E1" font-size="14">Synthetic reasoning</text>
      <rect x="150" y="0" width="480" height="22" rx="11" fill="#1E293B"/>
      <rect x="150" y="0" width="335" height="22" rx="11" fill="#64748B"/>
      <rect x="150" y="31" width="338" height="22" rx="11" fill="url(#dpo)"/>
      <rect x="150" y="62" width="350" height="22" rx="11" fill="#14B8A6"/>
      <text x="497" y="17" fill="#CBD5E1" font-size="13" font-weight="700">69.8</text>
      <text x="500" y="48" fill="#E9D5FF" font-size="13" font-weight="700">70.3  +0.5</text>
      <text x="512" y="79" fill="#99F6E4" font-size="13" font-weight="700">72.9</text>
    </g>

    <g transform="translate(28 213)">
      <text x="0" y="17" fill="#CBD5E1" font-size="14">SVAMP development</text>
      <rect x="150" y="0" width="480" height="22" rx="11" fill="#1E293B"/>
      <rect x="150" y="0" width="362" height="22" rx="11" fill="#64748B"/>
      <rect x="150" y="31" width="367" height="22" rx="11" fill="url(#dpo)"/>
      <rect x="150" y="62" width="371" height="22" rx="11" fill="#14B8A6"/>
      <text x="524" y="17" fill="#CBD5E1" font-size="13" font-weight="700">75.4</text>
      <text x="529" y="48" fill="#E9D5FF" font-size="13" font-weight="700">76.4  +1.0</text>
      <text x="533" y="79" fill="#99F6E4" font-size="13" font-weight="700">77.4</text>
    </g>

    <g transform="translate(28 333)" font-size="13">
      <circle cx="7" cy="0" r="7" fill="#64748B"/><text x="22" y="5" fill="#94A3B8">Frozen parent</text>
      <circle cx="142" cy="0" r="7" fill="#8B5CF6"/><text x="157" y="5" fill="#C4B5FD">Selected DPO</text>
      <circle cx="280" cy="0" r="7" fill="#14B8A6"/><text x="295" y="5" fill="#5EEAD4">Selected extra-SFT</text>
    </g>
    <rect x="28" y="365" width="644" height="1" fill="#1E293B"/>
    <text x="28" y="392" fill="#A5B4FC" font-size="13">Selected DPO: 100% parse success · 0.996× / 1.025× length ratios</text>
  </g>

  <g transform="translate(780 122)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="372" height="190" rx="18" fill="#111827" stroke="#334155"/>
    <text x="24" y="38" fill="#E2E8F0" font-size="18" font-weight="700">Preference accuracy</text>
    <text x="24" y="62" fill="#64748B" font-size="12">same 128 pairs · same frozen reference</text>
    <text x="24" y="113" fill="#C4B5FD" font-size="42" font-weight="800">64.1%</text>
    <text x="222" y="113" fill="#5EEAD4" font-size="28" font-weight="700">38.3%</text>
    <text x="24" y="139" fill="#A5B4FC" font-size="13">Selected DPO</text>
    <text x="222" y="139" fill="#5EEAD4" font-size="13">extra-SFT</text>
    <rect x="24" y="157" width="324" height="2" fill="#1E293B"/>
    <text x="186" y="180" text-anchor="middle" fill="#E9D5FF" font-size="14" font-weight="700">+25.8 percentage points</text>
  </g>

  <g transform="translate(780 332)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="372" height="200" rx="18" fill="#111827" stroke="#334155"/>
    <text x="24" y="38" fill="#E2E8F0" font-size="18" font-weight="700">Safety-first frontier</text>
    <text x="24" y="61" fill="#64748B" font-size="12">preference accuracy → · retention ↑</text>
    <line x1="50" y1="158" x2="330" y2="158" stroke="#475569"/>
    <line x1="50" y1="82" x2="50" y2="158" stroke="#475569"/>
    <line x1="50" y1="145" x2="330" y2="145" stroke="#FB7185" stroke-dasharray="5 5" opacity="0.7"/>
    <text x="324" y="139" text-anchor="end" fill="#FB7185" font-size="10">−5 pp gate</text>
    <circle cx="154" cy="101" r="11" fill="#A855F7" stroke="#E9D5FF" stroke-width="3"/>
    <path d="M154 84l4 9 10 1-8 7 2 10-8-5-9 5 2-10-7-7 10-1z" fill="#F8FAFC"/>
    <circle cx="277" cy="119" r="8" fill="#6366F1"/>
    <circle cx="272" cy="119" r="8" fill="#2DD4BF" opacity="0.9"/>
    <text x="154" y="79" text-anchor="middle" fill="#E9D5FF" font-size="11" font-weight="700">selected</text>
    <text x="154" y="181" text-anchor="middle" fill="#94A3B8" font-size="10">64.1%</text>
    <text x="275" y="181" text-anchor="middle" fill="#94A3B8" font-size="10">~80%</text>
  </g>

  <g transform="translate(48 558)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="1104" height="1" fill="#334155"/>
    <circle cx="10" cy="22" r="7" fill="#22C55E"/>
    <text x="28" y="27" fill="#BBF7D0" font-size="14" font-weight="700">15 / 15 development gates passed</text>
    <text x="330" y="27" fill="#94A3B8" font-size="13">3 / 3 DPO candidates eligible</text>
    <text x="625" y="27" fill="#94A3B8" font-size="13">17.4M trainable parameters</text>
    <text x="930" y="27" fill="#94A3B8" font-size="13">6.91 GiB peak GPU</text>
  </g>
</svg>
