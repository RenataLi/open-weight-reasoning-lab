<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Stage 3 held-out results</title>
  <desc id="desc">Comparison of base, QLoRA SFT, and continued-SFT on synthetic exact match, output format validity, and GSM8K exact match.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#17122C"/></linearGradient>
    <linearGradient id="sft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#818CF8"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="cont" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">STAGE 3 · HELD-OUT CONFIRMATION</text>
  <text x="56" y="88" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Mean across three locked seeds · 512 synthetic + 1,191 GSM8K tasks</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(48 125)">
      <rect width="344" height="330" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#E2E8F0" font-size="17" font-weight="700">Synthetic exact match</text>
      <text x="24" y="61" fill="#64748B" font-size="12">answer accuracy</text>
      <line x1="52" y1="268" x2="318" y2="268" stroke="#475569"/>
      <rect x="70" y="100" width="52" height="168" rx="7" fill="#64748B"/>
      <rect x="146" y="102" width="52" height="166" rx="7" fill="url(#sft)"/>
      <rect x="222" y="102" width="52" height="166" rx="7" fill="url(#cont)"/>
      <text x="96" y="90" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700">99.4%</text>
      <text x="172" y="92" text-anchor="middle" fill="#C7D2FE" font-size="15" font-weight="700">98.4%</text>
      <text x="248" y="92" text-anchor="middle" fill="#99F6E4" font-size="15" font-weight="700">98.5%</text>
      <text x="96" y="294" text-anchor="middle" fill="#94A3B8" font-size="12">Base</text>
      <text x="172" y="294" text-anchor="middle" fill="#A5B4FC" font-size="12">SFT</text>
      <text x="248" y="294" text-anchor="middle" fill="#5EEAD4" font-size="12">Cont. SFT</text>
      <rect x="24" y="310" width="296" height="1" fill="#1E293B"/>
    </g>

    <g transform="translate(428 125)">
      <rect width="344" height="330" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#E2E8F0" font-size="17" font-weight="700">Valid final-answer format</text>
      <text x="24" y="61" fill="#64748B" font-size="12">synthetic tasks</text>
      <line x1="52" y1="268" x2="318" y2="268" stroke="#475569"/>
      <rect x="70" y="225" width="52" height="43" rx="7" fill="#64748B"/>
      <rect x="146" y="100" width="52" height="168" rx="7" fill="url(#sft)"/>
      <rect x="222" y="100" width="52" height="168" rx="7" fill="url(#cont)"/>
      <text x="96" y="215" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700">22.7%</text>
      <text x="172" y="90" text-anchor="middle" fill="#C7D2FE" font-size="15" font-weight="700">100%</text>
      <text x="248" y="90" text-anchor="middle" fill="#99F6E4" font-size="15" font-weight="700">100%</text>
      <text x="96" y="294" text-anchor="middle" fill="#94A3B8" font-size="12">Base</text>
      <text x="172" y="294" text-anchor="middle" fill="#A5B4FC" font-size="12">SFT</text>
      <text x="248" y="294" text-anchor="middle" fill="#5EEAD4" font-size="12">Cont. SFT</text>
      <rect x="24" y="310" width="296" height="1" fill="#1E293B"/>
    </g>

    <g transform="translate(808 125)">
      <rect width="344" height="330" rx="18" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#E2E8F0" font-size="17" font-weight="700">GSM8K exact match</text>
      <text x="24" y="61" fill="#64748B" font-size="12">1,191 held-out tasks</text>
      <line x1="52" y1="268" x2="318" y2="268" stroke="#475569"/>
      <rect x="70" y="144" width="52" height="124" rx="7" fill="#64748B"/>
      <rect x="146" y="144" width="52" height="124" rx="7" fill="url(#sft)"/>
      <rect x="222" y="143" width="52" height="125" rx="7" fill="url(#cont)"/>
      <text x="96" y="134" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700">65.5%</text>
      <text x="172" y="134" text-anchor="middle" fill="#C7D2FE" font-size="15" font-weight="700">65.2%</text>
      <text x="248" y="133" text-anchor="middle" fill="#99F6E4" font-size="15" font-weight="700">65.8%</text>
      <text x="96" y="294" text-anchor="middle" fill="#94A3B8" font-size="12">Base</text>
      <text x="172" y="294" text-anchor="middle" fill="#A5B4FC" font-size="12">SFT</text>
      <text x="248" y="294" text-anchor="middle" fill="#5EEAD4" font-size="12">Cont. SFT</text>
      <rect x="24" y="310" width="296" height="1" fill="#1E293B"/>
    </g>
  </g>

  <g transform="translate(56 486)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    <circle cx="7" cy="0" r="7" fill="#64748B"/><text x="22" y="5" fill="#94A3B8">Base</text>
    <circle cx="96" cy="0" r="7" fill="#6366F1"/><text x="111" y="5" fill="#A5B4FC">QLoRA SFT</text>
    <circle cx="218" cy="0" r="7" fill="#14B8A6"/><text x="233" y="5" fill="#5EEAD4">Fresh continued-SFT control</text>
    <rect x="875" y="-18" width="213" height="36" rx="18" fill="#052E2B" stroke="#14B8A6"/>
    <text x="982" y="5" text-anchor="middle" fill="#99F6E4" font-weight="700">ALL LOCKED GATES PASSED</text>
  </g>
</svg>
