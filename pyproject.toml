[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-posttraining-lab"
version = "0.4.1"
description = "Reproducible local experiments for open-weight LLM post-training."
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.0",
  "datasets==5.0.1",
  "huggingface-hub==1.26.1",
  "peft==0.20.0",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3",
  "torch==2.13.0",
  "transformers==5.14.1",
  "trl==1.9.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
reasoning-lab = "reasoning_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
